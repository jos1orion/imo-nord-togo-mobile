name: Apply Supabase storage and cleanup migrations

on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/0017_storage_upload_constraints.sql
      - supabase/migrations/0018_property_images_one_megabyte.sql
      - supabase/migrations/0019_storage_api_cleanup.sql
      - supabase/migrations/0020_property_storage_cleanup_queue.sql
      - supabase/migrations/0022_expiration_trigger_single_sync.sql
      - supabase/migrations/0023_preserve_expired_listing_images.sql
      - supabase/migrations/0024_remove_legacy_storage_delete_triggers.sql
      - supabase/migrations/0025_account_deletion_requests.sql
      - supabase/migrations/0026_agent_support_inbox.sql
      - .github/workflows/apply-storage-upload-constraints.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-storage-upload-constraints
  cancel-in-progress: false

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error title=Secret SUPABASE_DB_URL absent::Ajoutez l’URL PostgreSQL Supabase dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --command="select 'Supabase connection OK' as status;" "$SUPABASE_DB_URL"

      - name: Apply 0017 storage upload constraints
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/0017_storage_upload_constraints.sql "$SUPABASE_DB_URL"

      - name: Apply 0018 property image size limit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/0018_property_images_one_megabyte.sql "$SUPABASE_DB_URL"

      - name: Apply 0019 storage cleanup function
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/0019_storage_api_cleanup.sql "$SUPABASE_DB_URL"

      - name: Apply 0020 storage cleanup queue
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 --file=supabase/migrations/0020_property_storage_cleanup_queue.sql "$SUPABASE_DB_URL"

      - name: Apply 0022 expiration trigger synchronization
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=supabase/migrations/0022_expiration_trigger_single_sync.sql \
            "$SUPABASE_DB_URL"

      - name: Preserve images of expired listings
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=supabase/migrations/0023_preserve_expired_listing_images.sql \
            "$SUPABASE_DB_URL"

      - name: Remove legacy direct Storage deletion triggers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=supabase/migrations/0024_remove_legacy_storage_delete_triggers.sql \
            "$SUPABASE_DB_URL"

      - name: Create account deletion request queue
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=supabase/migrations/0025_account_deletion_requests.sql \
            "$SUPABASE_DB_URL"

      - name: Create agent support inbox
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=supabase/migrations/0026_agent_support_inbox.sql \
            "$SUPABASE_DB_URL"
